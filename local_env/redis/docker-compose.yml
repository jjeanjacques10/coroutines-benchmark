services:
  redis:
    image: redis:7.2-alpine
    container_name: redis-rinha
    hostname: redis-rinha
    command: redis-server --save "" --appendonly no --maxclients 20000
    networks:
      - payment-processor
    ports:
      - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "200MB"

networks:
  payment-processor:
    name: payment-processor
    driver: bridge